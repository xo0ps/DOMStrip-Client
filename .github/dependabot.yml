# Automated dependency updates.
#
# This repo ships a package that directories install, so an outdated or vulnerable dependency
# is a supply-chain problem for every user, not just for us. Without an automated PR, a bump
# happens only when someone notices, which is how a known CVE sits in a published package.
#
# Dependabot opens a PR; a human reviews and merges it, because a dependency bump in a published
# package is a supply-chain change.

version: 2

updates:
  # uv is a first-class ecosystem: it updates pyproject.toml AND uv.lock together, which keeps
  # the manifest and the lock from drifting apart in the same PR.
  #
  # It also discovers benchmark/requirements.txt, so a separate `pip` entry for /benchmark is
  # redundant and produces a duplicate PR for every bump (observed: lxml, html2text,
  # readability-lxml and tiktoken each arrived twice). One entry covers both.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Grouped so a routine week produces one reviewable PR rather than one per package.
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  # Action SHAs are pinned deliberately in the workflows; a floating tag would undo that.
  # Dependabot is the supported way to move a pin forward.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels: ["dependencies", "ci"]

  # No docker entry: there is no Dockerfile. Add one together with the image if it is introduced.
  #
  # No terraform entry: there is no infrastructure here.
