[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "domstrip-mcp"
version = "0.1.3"
description = "MCP server that converts web pages into clean Markdown via the DOMStrip API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DOMStrip contributors" }]
keywords = ["mcp", "model-context-protocol", "markdown", "html", "llm", "agents", "web-scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# Deliberately minimal: no server, database, billing, or telemetry dependencies.
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "mcp>=2.3,<2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
domstrip-mcp = "domstrip_mcp.server:main"

[project.urls]
Homepage = "https://domstrip.dev"
Documentation = "https://github.com/xo0ps/DOMStrip-Client#readme"
Issues = "https://github.com/xo0ps/DOMStrip-Client/issues"
Repository = "https://github.com/xo0ps/DOMStrip-Client"

[tool.hatch.build.targets.wheel]
packages = ["src/domstrip_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
